name: Mobile apps

# Builds the iOS and Android apps whenever they change, so a mistake in the
# Swift or Kotlin shows up here instead of on your laptop.
on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [ main ]
    paths:
      - "mobile/**"

jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build for the simulator
        run: |
          xcodebuild -project Bookem.xcodeproj -scheme Bookem -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test -d build/Build/Products/Debug-iphonesimulator/Bookem.app

      - name: Run it and take a screenshot
        continue-on-error: true
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Bookem.app
          xcrun simctl launch "$UDID" com.ricealonzo.bookem
          sleep 45
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/ios-app.png"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshot
          path: ${{ runner.temp }}/ios-app.png
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      # The Gradle wrapper (gradlew) lets anyone build with the right Gradle
      # version. Make it if it isn't committed yet.
      - name: Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 9.2.0; fi

      - name: Build the debug app
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            mobile/android/gradlew
            mobile/android/gradlew.bat
            mobile/android/gradle/wrapper/
