# XcodeGen spec for the Bookem iOS app.
# On a Mac:  brew install xcodegen  then  xcodegen generate  in this folder,
# and open Bookem.xcodeproj. The .xcodeproj is generated, so it isn't committed.
name: Bookem
options:
  bundleIdPrefix: com.ricealonzo
  deploymentTarget:
    iOS: "16.0"
packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    from: 1.3.1
targets:
  Bookem:
    type: application
    platform: iOS
    sources:
      - Bookem
    dependencies:
      - package: HotwireNative
    info:
      path: Bookem/Info.plist
      properties:
        CFBundleDisplayName: Bookem
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneController
        # Lets the app reach `bin/dev` on your Mac while developing.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Bookem only uses standard HTTPS, so no export paperwork is needed.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ricealonzo.bookem
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
