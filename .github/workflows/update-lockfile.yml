# Regenerates Gemfile.lock after the Gemfile or .ruby-version changes on a
# feature branch, and commits it back. (Never runs on main.)
name: Update Gemfile.lock

on:
  push:
    branches-ignore: [ main ]
    paths: [ "Gemfile", ".ruby-version", ".github/workflows/update-lockfile.yml" ]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: false

      - name: Resolve gems
        run: |
          set -o pipefail
          bundle lock --update rails 2>&1 | tee tmp/lock.log || {
            echo "Conservative update failed; trying a full update"
            bundle lock --update 2>&1 | tee tmp/lock.log
          }

      - name: Report resolver errors
        if: failure()
        run: tail -30 tmp/lock.log | sed 's/^/::error::/'

      - name: Commit Gemfile.lock
        run: |
          if git diff --quiet Gemfile.lock; then
            echo "::notice::Gemfile.lock already up to date"
            exit 0
          fi
          git diff --stat Gemfile.lock
          grep -E "^    (rails|railties|devise|pundit|carrierwave) \(" Gemfile.lock | sed 's/^ */::notice::/'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "Update Gemfile.lock for Ruby $(cat .ruby-version) and Rails 8.1"
          git push
